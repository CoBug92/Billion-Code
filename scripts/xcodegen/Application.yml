name: ${PROJECT_NAME}

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  ${TARGET_NAME}:
    type: application
    platform: iOS
    sources:
      - path: ../../Main
        excludes:
          - Resources
          - UnitTests
      - path: ../../Main/Resources/Generated
      - path: ../../Main/Resources/Assets
        buildPhase: resources
      - path: ../../Main/Resources/Localization
        buildPhase: resources
      - path: ../../Main/Resources/Content
        buildPhase: resources
      - path: ../../Main/Resources/Configuration/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: ../../Main/Resources/Configuration/Info.plist
      properties:
        CFBundleDisplayName: ${APP_DISPLAY_NAME}
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - ru
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        PRODUCT_MODULE_NAME: ${TARGET_NAME}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ${TEAM_ID}
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
  BillionCodeUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../Main/UnitTests
    dependencies:
      - target: ${TARGET_NAME}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.unit-tests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  ${TARGET_NAME}:
    build:
      targets:
        ${TARGET_NAME}: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BillionCodeUnitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
