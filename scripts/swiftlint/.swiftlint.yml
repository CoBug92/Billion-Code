only_rules:
  - closing_brace
  - closure_parameter_position
  - closure_spacing
  - colon
  - comma
  - control_statement
  - duplicate_imports
  - empty_count
  - empty_enum_arguments
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - fatal_error_message
  - file_length
  - force_cast
  - force_try
  - force_unwrapping
  - function_name_whitespace
  - leading_whitespace
  - line_length
  - mark
  - opening_brace
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - redundant_void_return
  - return_arrow_whitespace
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - unused_import
  - vertical_whitespace

excluded:
  - Main/Resources/Generated

file_length:
  warning: 400
  error: 400

line_length:
  warning: 140
  error: 150
  ignores_comments: true
  ignores_urls: true

